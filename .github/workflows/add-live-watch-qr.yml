name: Add Live Watch QR
on:
  push:
    paths:
      - '.github/workflows/add-live-watch-qr.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Live Studio QR
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/core-cricket-app.tsx')
          s=p.read_text()

          old='  const [watchLink, setWatchLink] = useState("");\n'
          new='  const [watchLink, setWatchLink] = useState("");\n  const [watchQr, setWatchQr] = useState("");\n'
          if old not in s: raise SystemExit('watchLink state anchor not found')
          s=s.replace(old,new,1)

          old='setWatchLink(`${window.location.origin}/watch?token=${result.token}`); setBroadcasting(true); setNotice("Camera relay is live. Share the viewer link from Live Studio.");'
          new='const link = `${window.location.origin}/watch?token=${result.token}`; setWatchLink(link); setWatchQr(await QRCode.toDataURL(link,{width:240,margin:1,color:{dark:"#14281c",light:"#ffffff"}})); setBroadcasting(true); setNotice("Camera relay is live. Share the viewer link or QR code from Live Studio.");'
          if old not in s: raise SystemExit('startLive anchor not found')
          s=s.replace(old,new,1)

          old='liveCredentials.current = null; setBroadcasting(false); if (credentials)'
          new='liveCredentials.current = null; setBroadcasting(false); setWatchQr(""); if (credentials)'
          if old not in s: raise SystemExit('stopLive anchor not found')
          s=s.replace(old,new,1)

          old='broadcasting={broadcasting} watchLink={watchLink} onCamera={enableCamera}'
          new='broadcasting={broadcasting} watchLink={watchLink} watchQr={watchQr} onCamera={enableCamera}'
          if old not in s: raise SystemExit('LiveStudio props anchor not found')
          s=s.replace(old,new,1)

          old='function LiveStudio({ authorized, canScore, canControlSponsors, sponsorCount, match, battingTeam, bowlingTeam, videoRef, cameraOn, broadcasting, watchLink, onCamera, onScoreDevice, onBroadcast, onSponsor }: { authorized: boolean; canScore: boolean; canControlSponsors: boolean; sponsorCount: number; match?: Match; battingTeam?: Team; bowlingTeam?: Team; videoRef: React.RefObject<HTMLVideoElement | null>; cameraOn: boolean; broadcasting: boolean; watchLink: string; onCamera: () => void; onScoreDevice: () => void; onBroadcast: () => void; onSponsor: () => void }) {'
          new='function LiveStudio({ authorized, canScore, canControlSponsors, sponsorCount, match, battingTeam, bowlingTeam, videoRef, cameraOn, broadcasting, watchLink, watchQr, onCamera, onScoreDevice, onBroadcast, onSponsor }: { authorized: boolean; canScore: boolean; canControlSponsors: boolean; sponsorCount: number; match?: Match; battingTeam?: Team; bowlingTeam?: Team; videoRef: React.RefObject<HTMLVideoElement | null>; cameraOn: boolean; broadcasting: boolean; watchLink: string; watchQr: string; onCamera: () => void; onScoreDevice: () => void; onBroadcast: () => void; onSponsor: () => void }) {'
          if old not in s: raise SystemExit('LiveStudio signature anchor not found')
          s=s.replace(old,new,1)

          old='{watchLink && <div className="watch-share"><input readOnly value={watchLink} /><button onClick={() => void navigator.clipboard.writeText(watchLink)}>Copy link</button><a href={`https://wa.me/?text=${encodeURIComponent(`Watch this match live on Core Cricket: ${watchLink}`)}`} target="_blank" rel="noreferrer">WhatsApp</a></div>}'
          new='{watchLink && <><div className="watch-share"><input readOnly value={watchLink} /><button onClick={() => void navigator.clipboard.writeText(watchLink)}>Copy link</button><a href={`https://wa.me/?text=${encodeURIComponent(`Watch this match live on Core Cricket: ${watchLink}`)}`} target="_blank" rel="noreferrer">WhatsApp</a></div>{watchQr && <div className="live-watch-qr"><span>SCAN TO WATCH LIVE</span><img src={watchQr} alt="QR code to watch this Core Cricket live match" /><small>Open your phone camera and scan this code to watch the live stream.</small></div>}</>}'
          if old not in s: raise SystemExit('watch-share anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Add QR styles
        run: |
          cat >> app/globals.css <<'EOF'

/* Live Studio public watch QR */
.live-watch-qr{margin-top:16px;padding:16px;border:1px solid rgba(20,40,28,.14);border-radius:18px;background:rgba(255,255,255,.82);display:grid;justify-items:center;gap:10px;text-align:center}
.live-watch-qr>span{font-size:.72rem;font-weight:900;letter-spacing:.13em}
.live-watch-qr img{width:min(220px,100%);height:auto;border-radius:12px;background:#fff;padding:8px;box-shadow:0 10px 28px rgba(20,40,28,.12)}
.live-watch-qr small{max-width:280px;opacity:.72;line-height:1.4}
[data-theme="dark"] .live-watch-qr{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.13)}
EOF
      - name: Commit update and remove workflow
        run: |
          rm -f .github/workflows/add-live-watch-qr.yml
          git config user.name 'Core Cricket Update'
          git config user.email 'actions@github.com'
          git add components/core-cricket-app.tsx app/globals.css .github/workflows/add-live-watch-qr.yml
          git commit -m 'Generate QR code for every live broadcast'
          git push origin main
