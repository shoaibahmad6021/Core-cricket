name: Apply Assigned Scorer Broadcast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-assigned-scorer-broadcast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply assigned scorer broadcast
        run: |
          python3 scripts/allow-friendly-assigned-scorer-broadcast.py
          git config user.name "Core Cricket Update"
          git config user.email "actions@github.com"
          git add components/core-cricket-app.tsx app/api/live/route.ts
          git commit -m "Allow assigned scorer to start live broadcast" || exit 0
          git push
