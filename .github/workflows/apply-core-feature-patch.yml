name: Apply Core Cricket feature patch

on:
  push:
    branches:
      - production-feature-update
    paths:
      - ui-feature.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-feature-update
          fetch-depth: 0
      - name: Apply UI feature patch
        shell: bash
        run: |
          set -e
          if [ ! -f ui-feature.patch ]; then
            echo "Patch file is not present; nothing to apply."
            exit 0
          fi
          git apply --check ui-feature.patch
          git apply ui-feature.patch
          git config user.name "Core Cricket Update"
          git config user.email "actions@github.com"
          git add app/globals.css components/core-cricket-app.tsx
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "Add tournament standings MVP and role-based live UI"
            git push origin production-feature-update
          fi
