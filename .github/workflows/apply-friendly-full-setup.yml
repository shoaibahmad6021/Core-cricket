name: Apply Friendly Full Setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-friendly-full-setup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply friendly full setup
        run: |
          python3 scripts/apply-friendly-full-setup.py
          git config user.name "Core Cricket Update"
          git config user.email "actions@github.com"
          git add components/core-cricket-app.tsx app/api/lineup/route.ts app/api/match-setup/route.ts
          git commit -m "Add full friendly match setup flow" || exit 0
          git push
