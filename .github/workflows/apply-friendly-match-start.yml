name: Apply Friendly Match Start

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add friendly match start patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch friendly match start flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('components/core-cricket-app.tsx')
          s = p.read_text()

          old = '  const canScoreActiveMatch = canScoreTournament(activeMatch?.tournamentId ?? null) || (!userPreview && handoffMatchId === activeMatch?.id);'
          new = '  const canScoreFriendlyMatch = !userPreview && Boolean(activeMatch && !activeMatch.tournamentId && (user.isAdmin || canManageTeam(activeMatch.teamAId) || canManageTeam(activeMatch.teamBId)));\n  const canScoreActiveMatch = canScoreTournament(activeMatch?.tournamentId ?? null) || canScoreFriendlyMatch || (!userPreview && handoffMatchId === activeMatch?.id);'
          if old not in s:
              raise SystemExit('canScoreActiveMatch marker not found')
          s = s.replace(old, new, 1)

          old = '      {view === "score" && <Scoring readOnly={!canScoreActiveMatch} data={data} match={activeMatch} tournament={activeTournament} battingTeam={battingTeam} bowlingTeam={bowlingTeam} striker={striker} nonStriker={nonStriker} bowler={bowler} transferLink={transferLink} transferQr={transferQr} onTransfer={createScoringTransfer} onStartSetup={() => setModal("innings")} onScore={score} onUndo={undo} onWicket={() => setModal("wicket")} onEndInnings={() => { setModal("tie"); return Promise.resolve(); }} />}'
          new = '      {view === "score" && <Scoring readOnly={!canScoreActiveMatch} data={data} match={activeMatch} tournament={activeTournament} battingTeam={battingTeam} bowlingTeam={bowlingTeam} striker={striker} nonStriker={nonStriker} bowler={bowler} transferLink={transferLink} transferQr={transferQr} onTransfer={createScoringTransfer} onStartSetup={() => { if (activeMatch && !activeMatch.tournamentId) { setModal("innings"); return; } if (activeMatch?.tournamentId) { setSelectedTournamentId(activeMatch.tournamentId); setTournamentHubOpen(true); setManageTab("matches"); go("manage"); } }} onScore={score} onUndo={undo} onWicket={() => setModal("wicket")} onEndInnings={() => { setModal("tie"); return Promise.resolve(); }} />}'
          if old not in s:
              raise SystemExit('Scoring render marker not found')
          s = s.replace(old, new, 1)

          old = '  if (match.status === "Upcoming") return <div className="page"><SectionHead eyebrow={tournament?.name ?? "TOURNAMENT MATCH"} title={`${battingTeam?.shortName} vs ${bowlingTeam?.shortName}`} /><section className="no-live-page"><span>＋</span><h2>{readOnly ? "Match has not started" : "Official scorer: start this match"}</h2><p>{readOnly ? "The live scorecard will appear after an assigned tournament scorer starts scoring." : "Select the opening batters and bowler to begin the live score."}</p>{!readOnly && <button className="primary-button" onClick={onStartSetup}>Start scoring</button>}</section></div>;'
          new = '  if (match.status === "Upcoming") { const friendly = !match.tournamentId; return <div className="page"><SectionHead eyebrow={friendly ? "FRIENDLY MATCH" : (tournament?.name ?? "TOURNAMENT MATCH")} title={`${battingTeam?.shortName} vs ${bowlingTeam?.shortName}`} /><section className="no-live-page"><span>＋</span><h2>{readOnly ? "Match has not started" : (friendly ? "Friendly match ready to start" : "Official scorer: start this match")}</h2><p>{readOnly ? (friendly ? "An authorized admin or team captain can start this friendly match." : "The live scorecard will appear after an assigned tournament scorer starts scoring.") : (friendly ? "Choose the opening batters and bowler to start this standalone friendly match." : "Continue to scorer selection, Playing XI and toss before scoring begins.")}</p>{!readOnly && <button className="primary-button" onClick={onStartSetup}>{friendly ? "Start Friendly Match" : "Start Match"}</button>}</section></div>; }'
          if old not in s:
              raise SystemExit('Upcoming Scoring marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name "Core Cricket Update"
          git config user.email "actions@github.com"
          git add components/core-cricket-app.tsx
          git commit -m "Allow standalone friendly matches to start" || exit 0
          git push
