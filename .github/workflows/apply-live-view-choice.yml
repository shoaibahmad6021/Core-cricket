name: Apply Live View Choice

on:
  push:
    paths:
      - '.github/workflows/apply-live-view-choice.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live viewer choice
        run: python3 scripts/add-live-view-choice.py
      - name: Commit change
        run: |
          git config user.name "Core Cricket Update"
          git config user.email "actions@github.com"
          git add components/core-cricket-app.tsx
          git commit -m "Let viewers choose scorecard or live broadcast"
          git push
