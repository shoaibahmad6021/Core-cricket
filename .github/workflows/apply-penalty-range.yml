name: Apply Penalty Range

on:
  push:
    paths:
      - '.github/trigger-penalty-range.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand penalty run selector
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('components/core-cricket-app.tsx')
          s=p.read_text()
          old='(extraType === "Penalty" ? [5,10] : [1,2,3,4,5,6,7]).map((run) => <option key={run}>{run}</option>)'
          new='(extraType === "Penalty" ? Array.from({ length: 20 }, (_, index) => index + 1) : [1,2,3,4,5,6,7]).map((run) => <option key={run}>{run}</option>)'
          if old not in s:
              raise SystemExit('Penalty selector pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "Core Cricket Update"
          git config user.email "actions@github.com"
          git add components/core-cricket-app.tsx
          git commit -m "Allow penalty runs from 1 to 20" || exit 0
          git push
