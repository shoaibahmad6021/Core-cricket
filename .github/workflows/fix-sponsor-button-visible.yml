name: Fix Sponsor Button Visibility

on:
  push:
    paths:
      - '.github/workflows/fix-sponsor-button-visible.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sponsor control visible
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('components/core-cricket-app.tsx')
          s=p.read_text()
          old='''{canControlSponsors && <div className="card sponsor-control-card"><span>SPONSOR OVERLAY</span><h3>Manual sponsor graphic</h3><p>{sponsorCount ? `${sponsorCount} sponsor${sponsorCount === 1 ? "" : "s"} ready. Each press shows the next sponsor for 8 seconds.` : "Add sponsor logos in the tournament first."}</p><button className="secondary-button" disabled={!broadcasting || sponsorCount === 0} onClick={onSponsor}>Show Sponsor</button><small>{!broadcasting ? "Start the live broadcast first." : sponsorCount === 0 ? "No tournament sponsors available." : "Press again for the next sponsor."}</small></div>}'''
          new='''{match?.tournamentId && <div className="card sponsor-control-card"><span>SPONSOR OVERLAY</span><h3>Manual sponsor graphic</h3><p>{sponsorCount ? `${sponsorCount} sponsor${sponsorCount === 1 ? "" : "s"} ready. Each press shows the next sponsor for 8 seconds.` : "Add sponsor logos in the tournament first."}</p><button className="secondary-button" disabled={!canControlSponsors || !broadcasting || sponsorCount === 0} onClick={onSponsor}>Show Sponsor</button><small>{!canControlSponsors ? "Only the site admin or tournament organizer can trigger sponsor overlays." : !broadcasting ? "Start the live broadcast first." : sponsorCount === 0 ? "No tournament sponsors available." : "Press again for the next sponsor."}</small></div>}'''
          if old not in s:
              raise SystemExit('sponsor control block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "Core Cricket Update"
          git config user.email "actions@github.com"
          git rm .github/workflows/fix-sponsor-button-visible.yml
          git add components/core-cricket-app.tsx
          git commit -m "Keep sponsor overlay control visible in Live Studio"
          git push
