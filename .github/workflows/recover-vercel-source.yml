name: Recover Core Cricket Production Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: team_s6mLjuWIATNxUhFgVOKb0l8p
      VERCEL_DEPLOYMENT_ID: dpl_CwRtAE4eSYgrKVE9mc2DikrZwrJd

    steps:
      - uses: actions/checkout@v4

      - name: Recover source from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python3 <<'PY'
          import os, json, base64, urllib.request, urllib.parse
          from pathlib import Path

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          dep = os.environ["VERCEL_DEPLOYMENT_ID"]
          out = Path("recovered-original")
          out.mkdir(exist_ok=True)
          headers = {"Authorization": f"Bearer {token}"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return r.read()

          tree = json.loads(get(
              f"https://api.vercel.com/v6/deployments/{dep}/files?teamId={urllib.parse.quote(team)}"
          ).decode())

          files = []
          def walk(nodes, parent=""):
              for n in nodes:
                  path = f"{parent}/{n.get('name','')}".lstrip("/")
                  if n.get("type") == "directory":
                      walk(n.get("children", []), path)
                  elif n.get("type") == "file" and n.get("uid"):
                      files.append((path, n["uid"]))
          walk(tree)

          for path, uid in files:
              raw = get(
                  f"https://api.vercel.com/v8/deployments/{dep}/files/{uid}"
                  f"?teamId={urllib.parse.quote(team)}&path={urllib.parse.quote(path)}"
              )
              content = raw
              try:
                  obj = json.loads(raw.decode())
                  if isinstance(obj, dict):
                      for k in ("data","content","file","body","value"):
                          if isinstance(obj.get(k), str):
                              try:
                                  content = base64.b64decode(obj[k])
                              except Exception:
                                  content = obj[k].encode()
                              break
              except Exception:
                  pass

              dest = out / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(content)

          print(f"Recovered {len(files)} files")
          PY

      - name: Create ZIP
        run: |
          cd recovered-original
          zip -r ../core-cricket-original-source.zip .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: core-cricket-original-source
          path: core-cricket-original-source.zip

      - name: Commit recovered source
        run: |
          git config user.name "Core Cricket Recovery"
          git config user.email "actions@github.com"
          git add recovered-original
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Recover original Core Cricket production source"
            git push
          fi
